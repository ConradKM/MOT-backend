<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#1f2937; padding:20px 32px;">
              <span style="color:#ffffff; font-size:18px; font-weight:600;">{{ business_name }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px; background-color:#f9fafb; border-top:1px solid #e5e7eb;">
              <p style="margin:0 0 4px; font-size:13px; color:#6b7280;">
                {{ business_name }}{% if business_phone %} &middot; {{ business_phone }}{% endif %}{% if business_email %} &middot; {{ business_email }}{% endif %}
              </p>
              {% if business_address %}<p style="margin:0 0 4px; font-size:13px; color:#6b7280;">{{ business_address }}</p>{% endif %}
              <p style="margin:8px 0 0; font-size:11px; color:#9ca3af;">Powered by {{ platform_name_tm }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
