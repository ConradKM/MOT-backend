[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --durations=10"
console_output_style = "count"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["flask_smorest.*", "flask_migrate.*", "flask_cors.*", "flask_sock.*", "simple_websocket.*", "boto3.*", "botocore.*", "celery.*", "twilio.*", "yaml.*", "resend.*"]
ignore_missing_imports = true
